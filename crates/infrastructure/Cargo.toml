[package]
name = "quotavista-infrastructure"
description = "Storage, secret, and network boundaries for QuotaVista. Synthetic-tested SQLite persistence; secrets and network remain deferred."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
quotavista-core = { path = "../core" }
chrono = "0.4.42"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# SQLx 0.9 accepts <0.38; this bundle is SQLite 3.51.3 with the WAL-reset fix.
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
