[package]
name = "quotavista-infrastructure"
description = "Storage, secret, and network boundaries for QuotaVista. Synthetic-tested SQLite persistence; native secret stores; network remains deferred."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
quotavista-core = { path = "../core" }
chrono = "0.4.42"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
# SQLx 0.9 accepts <0.38; this bundle is SQLite 3.51.3 with the WAL-reset fix.
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
# Native secret stores: pinned keyring-core with explicit platform adapters.
# Versions are locked because error variants and constructors drive the
# adapter's locked/unavailable/needs-credentials mapping.
[target.'cfg(target_os = "macos")'.dependencies]
keyring-core = "=1.0.1"
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring-core = "=1.0.1"
dbus-secret-service-keyring-store = "=1.0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
