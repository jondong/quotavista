[package]
name = "quotavista-providers"
description = "Provider adapters for QuotaVista: synthetic demo adapters plus the OpenRouter live-adapter skeleton."
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
quotavista-core = { path = "../core" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "system-proxy"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
