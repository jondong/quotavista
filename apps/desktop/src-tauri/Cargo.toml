[package]
name = "quotavista-desktop"
description = "Tauri 2 desktop composition root for the QuotaVista prototype"
edition.workspace = true
license.workspace = true
publish.workspace = true
version.workspace = true

[lib]
name = "quotavista_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quotavista-core = { path = "../../../crates/core" }
quotavista-contracts = { path = "../../../crates/contracts" }
quotavista-infrastructure = { path = "../../../crates/infrastructure" }
quotavista-providers = { path = "../../../crates/providers" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
